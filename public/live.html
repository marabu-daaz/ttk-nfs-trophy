    </main>

    <!-- TOAST CONTAINER -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- SCRIPTS -->
    <script type="importmap">
        {
            "imports": {
                "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
            }
        }
    </script>

    <script type="module">
        // ============================================================
        // LIVE-TICKER - MIT SUPABASE PROJEKT B
        // ============================================================

        import { createClient } from "@supabase/supabase-js";
        import { SUPABASE_URL_B, SUPABASE_ANON_KEY_B } from "../config.js";

        console.log('✅ Config geladen:');
        console.log('SUPABASE_URL_B:', SUPABASE_URL_B);
        console.log('SUPABASE_ANON_KEY_B vorhanden:', !!SUPABASE_ANON_KEY_B);

        const supabase = createClient(SUPABASE_URL_B, SUPABASE_ANON_KEY_B);

        // ============================================================
        // STATE
        // ============================================================
        let state = {
            players: [],
            matches: [],
            settings: [],
            bewerbe: [],
            selectedBewerb: '',
            favoritePlayer: null,
            tournamentName: 'NFS Trophy',
            loading: false,
            lastUpdate: null,
            startTime: null,
            theme: 'dark',
        };

        // DOM refs
        const $ = (id) => document.getElementById(id);
        const bewerbSelect = $('bewerbSelect');
        const favInput = $('favPlayerInput');
        const refreshBtn = $('refreshBtn');
        const statusDot = $('statusDot');
        const statusText = $('statusText');
        const lastUpdateEl = $('lastUpdate');
        const tournamentNameEl = $('tournamentName');
        const themeToggle = $('themeToggle');

        const containers = {
            table: $('tableContainer'),
            meinplan: $('meinplanContainer'),
            live: $('liveContainer'),
            queue: $('queueContainer'),
            pots: $('potsContainer'),
            stats: $('statsContainer'),
            system: $('systemContainer'),
        };

        // ============================================================
        // THEME
        // ============================================================
        function loadTheme() {
            const saved = localStorage.getItem('theme') || 'dark';
            state.theme = saved;
            document.documentElement.setAttribute('data-theme', saved);
            themeToggle.textContent = saved === 'dark' ? '☀️' : '🌙';
        }

        function toggleTheme() {
            const newTheme = state.theme === 'dark' ? 'light' : 'dark';
            state.theme = newTheme;
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            themeToggle.textContent = newTheme === 'dark' ? '☀️' : '🌙';
        }

        themeToggle.addEventListener('click', toggleTheme);
        loadTheme();

        // ============================================================
        // HELPERS
        // ============================================================
        function esc(s) {
            if (s === null || s === undefined) return '';
            return String(s).replace(/[&<>"]/g, (c) => {
                const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
                return map[c] || c;
            });
        }

        function showToast(msg, isError = false) {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? 'error' : ''}`;
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('fade-out');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        function formatDuration(startIso) {
            if (!startIso) return '';
            const start = new Date(startIso);
            const now = new Date();
            const diff = Math.floor((now - start) / 1000);
            if (diff < 0) return '';
            const hours = Math.floor(diff / 3600);
            const minutes = Math.floor((diff % 3600) / 60);
            const seconds = diff % 60;
            if (hours > 0) {
                return `${hours}h ${String(minutes).padStart(2, '0')}m ${String(seconds).padStart(2, '0')}s`;
            }
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function formatDurationSeconds(sec) {
            if (!sec || sec <= 0) return '0:00';
            const hours = Math.floor(sec / 3600);
            const minutes = Math.floor((sec % 3600) / 60);
            const seconds = Math.floor(sec % 60);
            if (hours > 0) {
                return `${hours}h ${String(minutes).padStart(2, '0')}m ${String(seconds).padStart(2, '0')}s`;
            }
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function parseDurationToSeconds(durStr) {
            if (!durStr || durStr === '-' || durStr === '0m 0s') return 0;
            let secs = 0;
            try {
                if (durStr.includes('h ')) {
                    const parts = durStr.split('h ');
                    const h = parseInt(parts[0]);
                    const rest = parts[1].replace('s', '').split('m ');
                    const m = parseInt(rest[0]);
                    const s = parseInt(rest[1] || 0);
                    secs = h * 3600 + m * 60 + s;
                } else if (durStr.includes('m ')) {
                    const parts = durStr.replace('s', '').split('m ');
                    const m = parseInt(parts[0]);
                    const s = parseInt(parts[1] || 0);
                    secs = m * 60 + s;
                }
            } catch (e) { }
            return secs;
        }

        window.selectPlayer = function (playerId) {
            const player = state.players.find(p => String(p.id) === String(playerId));
            if (player) {
                state.favoritePlayer = player;
                favInput.value = player.name;
                const url = new URL(window.location);
                url.searchParams.set('fav', playerId);
                window.history.replaceState({}, '', url);
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.querySelector('[data-tab="meinplan"]').classList.add('active');
                document.getElementById('tab-meinplan').classList.add('active');
                renderAll();
            }
        };

        // ============================================================
        // CORE LOGIC
        // ============================================================

        async function loadData() {
            try {
                state.loading = true;
                setStatus('loading', 'Lade Daten...');

                console.log('📡 Lade Daten von Supabase...');

                const { data: players, error: playersError } = await supabase
                    .from('players')
                    .select('*')
                    .eq('is_present', true)
                    .order('name');

                if (playersError) throw playersError;
                state.players = players || [];
                console.log(`✅ ${state.players.length} Spieler geladen`);

                const { data: settings, error: settingsError } = await supabase
                    .from('settings')
                    .select('*');

                if (settingsError) throw settingsError;
                state.settings = settings || [];
                console.log(`✅ ${state.settings.length} Settings geladen`);

                const metaName = state.settings.find(s => s.key === 'meta_name')?.value || 'NFS Trophy';
                state.tournamentName = metaName;
                if (tournamentNameEl) tournamentNameEl.textContent = metaName;

                const bewerbeSet = new Set();
                state.players.forEach(p => {
                    if (p.bewerbe) {
                        p.bewerbe.split(',').forEach(b => {
                            const trimmed = b.trim();
                            if (trimmed) bewerbeSet.add(trimmed);
                        });
                    }
                });
                state.bewerbe = Array.from(bewerbeSet).map(name => ({ name }));
                console.log(`✅ ${state.bewerbe.length} Bewerbe gefunden`);

                if (state.bewerbe.length > 0) {
                    const lastBewerb = localStorage.getItem('last_bewerb');
                    if (lastBewerb && state.bewerbe.some(b => b.name === lastBewerb)) {
                        state.selectedBewerb = lastBewerb;
                    } else {
                        state.selectedBewerb = state.bewerbe[0].name;
                    }
                }

                const { data: matches, error: mErr } = await supabase
                    .from('matches')
                    .select('*');

                if (mErr) {
                    console.warn('⚠️ Keine Matches gefunden:', mErr);
                    state.matches = [];
                } else {
                    state.matches = matches || [];
                    console.log(`✅ ${state.matches.length} Matches geladen`);

                    state.matches = state.matches.map(m => {
                        const p1 = state.players.find(p => p.id === m.player1_id);
                        const p2 = state.players.find(p => p.id === m.player2_id);
                        return {
                            ...m,
                            player1_name: p1 ? p1.name : 'Unbekannt',
                            player2_name: p2 ? p2.name : 'Unbekannt',
                            player1_rc: p1 ? p1.rc_points : 0,
                            player2_rc: p2 ? p2.rc_points : 0,
                            player1_club: p1 ? p1.club_short : '',
                            player2_club: p2 ? p2.club_short : '',
                        };
                    });
                }

                const urlParams = new URLSearchParams(window.location.search);
                const favId = urlParams.get('fav');
                if (favId) {
                    const fav = state.players.find(p => String(p.id) === favId);
                    if (fav) {
                        state.favoritePlayer = fav;
                        favInput.value = fav.name;
                    }
                }

                state.startTime = new Date();
                populateBewerbSelect();
                renderAll();
                setStatus('online', 'Live');
                state.lastUpdate = new Date();
                lastUpdateEl.textContent = `Stand: ${state.lastUpdate.toLocaleTimeString('de-AT')}`;

            } catch (err) {
                console.error('❌ Fehler beim Laden:', err);
                showToast(`Fehler beim Laden der Daten: ${err.message}`, true);
                setStatus('offline', 'Fehler');
            } finally {
                state.loading = false;
            }
        }

        // ============================================================
        // RENDER FUNCTIONS
        // ============================================================

        function renderAll() {
            renderTable();
            renderMeinPlan();
            renderLive();
            renderQueue();
            renderPots();
            renderStats();
            renderSystem();
        }

        // ----- TABELLE -----
        function renderTable() {
            const container = containers.table;
            if (!container) return;

            const bewerbName = state.selectedBewerb;
            if (!bewerbName) {
                container.innerHTML = `
                    <div style="text-align:center; padding:30px 0; color:var(--text-muted);">
                        Bitte wähle einen Bewerb aus.
                    </div>
                `;
                return;
            }

            const playersInBewerb = state.players.filter(p => {
                if (!p.bewerbe) return false;
                return p.bewerbe.split(',').some(b => b.trim() === bewerbName);
            });

            if (playersInBewerb.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center; padding:30px 0; color:var(--text-muted);">
                        Noch keine Spieler für diesen Bewerb.
                    </div>
                `;
                return;
            }

            const matchesInBewerb = state.matches.filter(m => m.bewerb === bewerbName);
            const ranking = calculateRanking(playersInBewerb, matchesInBewerb);

            if (!ranking || ranking.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center; padding:30px 0; color:var(--text-muted);">
                        Noch keine Ergebnisse für diesen Bewerb.
                    </div>
                `;
                return;
            }

            const searchInput = document.getElementById('tableSearch');
            const searchTerm = searchInput ? searchInput.value.toLowerCase().trim() : '';

            let filteredRanking = ranking;
            if (searchTerm) {
                filteredRanking = ranking.filter(p =>
                    p.name.toLowerCase().includes(searchTerm) ||
                    (p.verein && p.verein.toLowerCase().includes(searchTerm))
                );
            }

            let html = `<div class="table-wrap"><table class="live-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Verein</th>
                        <th class="stats">Sp</th>
                        <th class="stats">Sg</th>
                        <th class="stats">SV</th>
                        <th class="stats">BV</th>
                    </tr>
                </thead>
                <tbody>`;

            filteredRanking.forEach((p, idx) => {
                if (!p.stats) {
                    p.stats = {
                        matches: 0, wins: 0, sets_won: 0, sets_lost: 0, balls_won: 0, balls_lost: 0,
                        tie_symbol: ''
                    };
                }

                const isFav = state.favoritePlayer && p.id === state.favoritePlayer.id;
                const rankClass = idx === 0 ? 'gold' : idx === 1 ? 'silver' : idx === 2 ? 'bronze' : '';
                const rowClass = isFav ? 'highlight-fav' : '';
                const actualRank = ranking.indexOf(p) + 1;

                html += `
                    <tr class="${rowClass}" data-player-id="${p.id}" onclick="selectPlayer('${p.id}')">
                        <td class="rank ${rankClass}">${actualRank}</td>
                        <td class="name">${esc(p.name)}</td>
                        <td class="verein">${esc(p.verein || '-')}</td>
                        <td class="stats">${p.stats.matches || 0}</td>
                        <td class="stats">${p.stats.wins || 0}${p.stats.tie_symbol || ''}</td>
                        <td class="stats">${p.stats.sets_won || 0}:${p.stats.sets_lost || 0}</td>
                        <td class="stats">${p.stats.balls_won || 0}:${p.stats.balls_lost || 0}</td>
                    </tr>
                `;
            });

            html += `</tbody></table></div>`;
            html += `<p style="font-size:11px; color:var(--text-muted); margin-top:8px;">
                ⚔️ = Platzierung durch direkten Vergleich (Minitabelle) entschieden.
                💡 Klicke auf einen Spieler für seinen Spielplan.
            </p>`;

            container.innerHTML = html;
        }

        // ============================================================
        // RANKING BERECHNUNG (KORREKT)
        // ============================================================
        function calculateRanking(players, matches) {
            // Initialisiere Statistiken für alle Spieler
            const stats = {};
            players.forEach(p => {
                stats[p.id] = {
                    id: p.id,
                    name: p.name,
                    verein: p.club_short || '',
                    rc: p.rc_points || 0,
                    matches: 0,
                    wins: 0,
                    sets_won: 0,
                    sets_lost: 0,
                    balls_won: 0,
                    balls_lost: 0,
                    opponents: [],
                    opponentMatches: {},
                    tie_symbol: '',
                    stats: {
                        matches: 0, wins: 0, sets_won: 0, sets_lost: 0, balls_won: 0, balls_lost: 0,
                        tie_symbol: ''
                    }
                };
            });

            // Spiele auswerten
            matches.forEach(m => {
                if (!m.is_played) return;
                const p1 = stats[m.player1_id];
                const p2 = stats[m.player2_id];
                if (!p1 || !p2) return;

                const s1 = m.sets_p1 || 0;
                const s2 = m.sets_p2 || 0;
                const b1 = m.points_p1 || 0;
                const b2 = m.points_p2 || 0;

                p1.matches += 1;
                p2.matches += 1;
                p1.stats.matches += 1;
                p2.stats.matches += 1;

                p1.sets_won += s1;
                p1.sets_lost += s2;
                p2.sets_won += s2;
                p2.sets_lost += s1;
                p1.stats.sets_won += s1;
                p1.stats.sets_lost += s2;
                p2.stats.sets_won += s2;
                p2.stats.sets_lost += s1;

                p1.balls_won += b1;
                p1.balls_lost += b2;
                p2.balls_won += b2;
                p2.balls_lost += b1;
                p1.stats.balls_won += b1;
                p1.stats.balls_lost += b2;
                p2.stats.balls_won += b2;
                p2.stats.balls_lost += b1;

                p1.opponents.push(m.player2_id);
                p2.opponents.push(m.player1_id);
                p1.opponentMatches[m.player2_id] = { sets_p1: s1, sets_p2: s2 };
                p2.opponentMatches[m.player1_id] = { sets_p1: s2, sets_p2: s1 };

                if (s1 > s2) {
                    p1.wins += 1;
                    p1.stats.wins += 1;
                } else {
                    p2.wins += 1;
                    p2.stats.wins += 1;
                }
            });

            // Hilfsfunktion: Prüft, ob alle in der Gruppe gegeneinander gespielt haben
            function allPlayedEachOther(group) {
                for (let i = 0; i < group.length; i++) {
                    for (let j = i + 1; j < group.length; j++) {
                        const hasMatch = group[i].opponentMatches[group[j].id] !== undefined ||
                            group[j].opponentMatches[group[i].id] !== undefined;
                        if (!hasMatch) return false;
                    }
                }
                return true;
            }

            // Minitabelle: Sortiert eine vollständig verbundene Gruppe anhand der direkten Duelle
            function sortByMiniTable(group) {
                const miniStats = {};
                group.forEach(p => {
                    miniStats[p.id] = {
                        ...p,
                        miniWins: 0,
                        miniSetsWon: 0,
                        miniSetsLost: 0,
                        miniBallsWon: 0,
                        miniBallsLost: 0
                    };
                });

                // Zähle die direkten Duelle innerhalb der Gruppe
                for (let i = 0; i < group.length; i++) {
                    for (let j = i + 1; j < group.length; j++) {
                        const p1 = group[i];
                        const p2 = group[j];
                        const match = p1.opponentMatches[p2.id];
                        if (match) {
                            const s1 = match.sets_p1;
                            const s2 = match.sets_p2;
                            if (s1 > s2) {
                                miniStats[p1.id].miniWins += 1;
                            } else {
                                miniStats[p2.id].miniWins += 1;
                            }
                            miniStats[p1.id].miniSetsWon += s1;
                            miniStats[p1.id].miniSetsLost += s2;
                            miniStats[p2.id].miniSetsWon += s2;
                            miniStats[p2.id].miniSetsLost += s1;
                            // Bälle in der Minitabelle sind nicht notwendig, da die direkten Duelle
                            // bereits durch Siege und Sätze abgebildet werden.
                            // Falls doch Gleichstand, wird später RC herangezogen.
                        }
                    }
                }

                // Rekursive Sortierung der Minitabelle mit denselben Kriterien:
                // Mini-Siege, dann Mini-SV, dann Mini-BV, dann RC
                // Dazu nutzen wir die gleiche `sortGroup`-Funktion, aber mit den Mini-Werten.
                // Da die Gruppe vollständig verbunden ist, können wir die Minitabelle
                // einfach nach diesen Kriterien sortieren.
                const sorted = Object.values(miniStats).sort((a, b) => {
                    if (a.miniWins !== b.miniWins) return b.miniWins - a.miniWins;
                    const aSv = a.miniSetsWon / (a.miniSetsLost || 1);
                    const bSv = b.miniSetsWon / (b.miniSetsLost || 1);
                    if (aSv !== bSv) return bSv - aSv;
                    const aBv = a.balls_won / (a.balls_lost || 1);
                    const bBv = b.balls_won / (b.balls_lost || 1);
                    if (aBv !== bBv) return bBv - aBv;
                    return a.rc - b.rc;
                });

                // ⚔️-Symbol für alle setzen, da die Minitabelle angewendet wurde
                sorted.forEach(p => {
                    p.tie_symbol = ' ⚔️';
                    p.stats.tie_symbol = ' ⚔️';
                });

                return sorted;
            }

            // Rekursive Hauptsortierfunktion
            function sortGroup(group) {
                if (group.length <= 1) return group;

                // 1. Nach Siegen gruppieren
                const winsMap = {};
                group.forEach(p => {
                    const w = p.wins;
                    if (!winsMap[w]) winsMap[w] = [];
                    winsMap[w].push(p);
                });

                let result = [];
                const sortedWins = Object.keys(winsMap).sort((a, b) => b - a);
                for (const w of sortedWins) {
                    let subgroup = winsMap[w];
                    if (subgroup.length === 1) {
                        result.push(subgroup[0]);
                        continue;
                    }

                    // Prüfen, ob alle in dieser Sieg-Gruppe gegeneinander gespielt haben
                    if (allPlayedEachOther(subgroup)) {
                        const sortedByMini = sortByMiniTable(subgroup);
                        result = result.concat(sortedByMini);
                        continue;
                    }

                    // Nach SV sortieren
                    const sortedBySV = [...subgroup].sort((a, b) => {
                        const aSv = a.sets_won / (a.sets_lost || 1);
                        const bSv = b.sets_won / (b.sets_lost || 1);
                        return bSv - aSv;
                    });

                    // Gruppen mit gleichem SV bilden
                    let i = 0;
                    let svGroups = [];
                    while (i < sortedBySV.length) {
                        let j = i + 1;
                        const iSv = sortedBySV[i].sets_won / (sortedBySV[i].sets_lost || 1);
                        while (j < sortedBySV.length) {
                            const jSv = sortedBySV[j].sets_won / (sortedBySV[j].sets_lost || 1);
                            if (jSv === iSv) j++;
                            else break;
                        }
                        svGroups.push(sortedBySV.slice(i, j));
                        i = j;
                    }

                    for (const svGroup of svGroups) {
                        if (svGroup.length === 1) {
                            result.push(svGroup[0]);
                            continue;
                        }

                        // Prüfen, ob diese SV-Gruppe gegeneinander gespielt hat
                        if (allPlayedEachOther(svGroup)) {
                            const sortedByMini = sortByMiniTable(svGroup);
                            result = result.concat(sortedByMini);
                            continue;
                        }

                        // Nach BV sortieren
                        const sortedByBV = [...svGroup].sort((a, b) => {
                            const aBv = a.balls_won / (a.balls_lost || 1);
                            const bBv = b.balls_won / (b.balls_lost || 1);
                            return bBv - aBv;
                        });

                        // Gruppen mit gleichem BV bilden
                        let k = 0;
                        let bvGroups = [];
                        while (k < sortedByBV.length) {
                            let l = k + 1;
                            const kBv = sortedByBV[k].balls_won / (sortedByBV[k].balls_lost || 1);
                            while (l < sortedByBV.length) {
                                const lBv = sortedByBV[l].balls_won / (sortedByBV[l].balls_lost || 1);
                                if (lBv === kBv) l++;
                                else break;
                            }
                            bvGroups.push(sortedByBV.slice(k, l));
                            k = l;
                        }

                        for (const bvGroup of bvGroups) {
                            if (bvGroup.length === 1) {
                                result.push(bvGroup[0]);
                                continue;
                            }

                            // Prüfen, ob diese BV-Gruppe gegeneinander gespielt hat
                            if (allPlayedEachOther(bvGroup)) {
                                const sortedByMini = sortByMiniTable(bvGroup);
                                result = result.concat(sortedByMini);
                                continue;
                            }

                            // Nach RC sortieren (niedriger zuerst)
                            const sortedByRC = [...bvGroup].sort((a, b) => a.rc - b.rc);

                            // Gruppen mit gleichem RC bilden
                            let m = 0;
                            let rcGroups = [];
                            while (m < sortedByRC.length) {
                                let n = m + 1;
                                const mRc = sortedByRC[m].rc;
                                while (n < sortedByRC.length) {
                                    if (sortedByRC[n].rc === mRc) n++;
                                    else break;
                                }
                                rcGroups.push(sortedByRC.slice(m, n));
                                m = n;
                            }

                            for (const rcGroup of rcGroups) {
                                if (rcGroup.length === 1) {
                                    result.push(rcGroup[0]);
                                    continue;
                                }

                                // Prüfen, ob diese RC-Gruppe gegeneinander gespielt hat
                                if (allPlayedEachOther(rcGroup)) {
                                    const sortedByMini = sortByMiniTable(rcGroup);
                                    result = result.concat(sortedByMini);
                                } else {
                                    // Alle Werte gleich – bleiben in der Reihenfolge
                                    result = result.concat(rcGroup);
                                }
                            }
                        }
                    }
                }
                return result;
            }

            // Starte mit allen Spielern
            const allPlayers = Object.values(stats);
            const sorted = sortGroup(allPlayers);

            // Stats synchronisieren
            sorted.forEach(p => {
                p.stats.matches = p.matches;
                p.stats.wins = p.wins;
                p.stats.sets_won = p.sets_won;
                p.stats.sets_lost = p.sets_lost;
                p.stats.balls_won = p.balls_won;
                p.stats.balls_lost = p.balls_lost;
                p.stats.tie_symbol = p.tie_symbol || '';
            });

            return sorted;
        }

        // ----- MEIN PLAN -----
        function renderMeinPlan() {
            const container = containers.meinplan;
            if (!container) return;

            const bewerbName = state.selectedBewerb;
            if (!bewerbName) {
                container.innerHTML = `
                    <div style="text-align:center; padding:30px 0; color:var(--text-muted);">
                        Bitte wähle einen Bewerb aus.
                    </div>
                `;
                return;
            }

            const playersInBewerb = state.players.filter(p => {
                if (!p.bewerbe) return false;
                return p.bewerbe.split(',').some(b => b.trim() === bewerbName);
            });

            if (playersInBewerb.length === 0) {
                container.innerHTML =
                    `<div style="text-align:center; padding:30px 0; color:var(--text-muted);">Keine Spieler in diesem Bewerb.</div>`;
                return;
            }

            let html = `
                <div style="margin-bottom:16px;">
                    <select id="meinPlanPlayer" style="width:100%; max-width:350px; padding:8px 12px; background:var(--bg-panel); border:1px solid var(--border); border-radius:8px; color:var(--text-main); font-family:inherit; font-size:13px; outline:none;">
                        <option value="">- Bitte wählen -</option>
            `;

            playersInBewerb.sort((a, b) => a.name.localeCompare(b.name)).forEach(p => {
                const selected = state.favoritePlayer && p.id === state.favoritePlayer.id ? 'selected' : '';
                html += `<option value="${p.id}" ${selected}>${esc(p.name)}</option>`;
            });

            html += `</select></div>`;

            const favId = state.favoritePlayer ? state.favoritePlayer.id : null;

            if (favId) {
                const player = state.players.find(p => p.id === favId);
                const matchesInBewerb = state.matches.filter(m => m.bewerb === bewerbName);
                const ranking = calculateRanking(playersInBewerb, matchesInBewerb);
                const playerRank = ranking.find(p => p.id === favId);

                if (player && playerRank) {
                    const rank = ranking.indexOf(playerRank) + 1;
                    const rankClass = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : '';
                    const totalMatches = playerRank.stats.matches || 0;
                    const wins = playerRank.stats.wins || 0;
                    const losses = totalMatches - wins;

                    let pot = '-',
                        seed = '-';
                    try {
                        if (player.pot_data) {
                            const potData = JSON.parse(player.pot_data);
                            pot = potData[bewerbName] || '-';
                        }
                        if (player.seed_data) {
                            const seedData = JSON.parse(player.seed_data);
                            seed = seedData[bewerbName] || '-';
                        }
                    } catch (e) { }

                    html += `
                        <div class="player-info-row">
                            <span class="rank-info">Aktueller Rang: <strong>#${rank}</strong></span>
                            <span class="pot-info">Topf ${pot} (Setzung ${seed})</span>
                        </div>
                        <div class="player-stats">
                            <div class="stat-item"><div class="label">Rang</div><div class="value ${rankClass}">#${rank}</div></div>
                            <div class="stat-item"><div class="label">Spiele</div><div class="value">${totalMatches}</div></div>
                            <div class="stat-item"><div class="label">Siege</div><div class="value win">${wins}</div></div>
                            <div class="stat-item"><div class="label">Niederlagen</div><div class="value loss">${losses}</div></div>
                            <div class="stat-item"><div class="label">SV</div><div class="value">${playerRank.stats.sets_won || 0}:${playerRank.stats.sets_lost || 0}</div></div>
                            <div class="stat-item"><div class="label">BV</div><div class="value">${playerRank.stats.balls_won || 0}:${playerRank.stats.balls_lost || 0}</div></div>
                            <div class="stat-item"><div class="label">RC</div><div class="value">${player.rc_points || 0}</div></div>
                        </div>
                    `;
                }
            }

            if (favId) {
                const playerMatches = state.matches.filter(m =>
                    m.bewerb === bewerbName &&
                    (m.player1_id === favId || m.player2_id === favId)
                );

                if (playerMatches.length === 0) {
                    html +=
                        `<div style="text-align:center; padding:16px 0; color:var(--text-muted);">Noch keine Matches für diesen Spieler.</div>`;
                } else {
                    html += `<div class="match-list">`;
                    playerMatches.forEach(m => {
                        const isP1 = m.player1_id === favId;
                        const oppName = isP1 ? m.player2_name : m.player1_name;
                        const statusClass = m.is_played ? 'played' : (m.table_number ? 'running' : (m
                            .queue_pos ? 'queue' : 'open'));
                        const statusText = m.is_played ? '✅ Beendet' : (m.table_number ? '🟠 Läuft' : (m
                            .queue_pos ? `⏳ #${m.queue_pos}` : '⚪ Offen'));
                        const result = m.is_played ? (isP1 ? m.sets_p1 : m.sets_p2) : '-';
                        const resultOpp = m.is_played ? (isP1 ? m.sets_p2 : m.sets_p1) : '-';
                        const isWin = m.is_played && result > resultOpp;
                        const myName = isP1 ? m.player1_name : m.player2_name;

                        let setDetailsHtml = '';
                        if (m.is_played && m.set_details && m.set_details !== '-') {
                            const sets = m.set_details.split(',');
                            const mySets = isP1 ? sets : sets.map(s => {
                                const parts = s.trim().split(':');
                                return parts.length === 2 ? `${parts[1]}:${parts[0]}` : s;
                            });
                            setDetailsHtml = `<div class="match-details">${esc(mySets.join(', '))}</div>`;
                        }

                        html += `
                            <div class="match-card">
                                <div class="match-info">
                                    <div class="round">${esc(m.round_name)}</div>
                                    <div class="players">
                                        <span>${esc(myName)}</span>
                                        <span class="vs">vs</span>
                                        <span>${esc(oppName)}</span>
                                    </div>
                                </div>
                                <div class="match-right">
                                    <div class="match-status ${statusClass}">${statusText}</div>
                                    ${m.is_played ? `
                                        <div class="match-result ${isWin ? 'win' : 'loss'}">${result}:${resultOpp}</div>
                                        ${setDetailsHtml}
                                    ` : ''}
                                </div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                }
            } else {
                html +=
                    `<div style="text-align:center; padding:16px 0; color:var(--text-muted);">Wähle einen Spieler aus, um seinen Spielplan zu sehen.</div>`;
            }

            container.innerHTML = html;

            const select = document.getElementById('meinPlanPlayer');
            if (select) {
                select.addEventListener('change', (e) => {
                    const val = e.target.value;
                    if (val) {
                        const player = state.players.find(p => p.id === val);
                        if (player) {
                            state.favoritePlayer = player;
                            favInput.value = player.name;
                            const url = new URL(window.location);
                            url.searchParams.set('fav', val);
                            window.history.replaceState({}, '', url);
                            renderMeinPlan();
                            renderTable();
                        }
                    } else {
                        state.favoritePlayer = null;
                        favInput.value = '';
                        const url = new URL(window.location);
                        url.searchParams.delete('fav');
                        window.history.replaceState({}, '', url);
                        renderMeinPlan();
                        renderTable();
                    }
                });
            }
        }

        // ----- LIVE -----
        function renderLive() {
            const container = containers.live;
            if (!container) return;

            const bewerbName = state.selectedBewerb;
            if (!bewerbName) {
                container.innerHTML = `
                    <div style="text-align:center; padding:30px 0; color:var(--text-muted);">
                        Bitte wähle einen Bewerb aus.
                    </div>
                `;
                return;
            }

            const activeMatches = state.matches.filter(m =>
                m.bewerb === bewerbName &&
                !m.is_played &&
                m.table_number !== null &&
                m.table_number !== undefined
            );

            const maxTable = 5;

            let html = `<div class="table-grid">`;
            for (let t = 1; t <= maxTable; t++) {
                const match = activeMatches.find(m => m.table_number === t);
                const isFav = match && state.favoritePlayer &&
                    (match.player1_id === state.favoritePlayer.id || match.player2_id === state.favoritePlayer.id);

                if (match) {
                    const duration = match.start_time ? formatDuration(match.start_time) : '';
                    html += `
                        <div class="table-card running">
                            <div class="table-nr">🏓 Tisch ${t}</div>
                            <div class="table-players">
                                <span>${esc(match.player1_name)}</span>
                                <span class="vs">vs</span>
                                <span>${esc(match.player2_name)}</span>
                                ${isFav ? '<span class="fav-badge">⭐</span>' : ''}
                            </div>
                            <div class="table-time">
                                ${duration ? `<span class="running-time">⏱ ${duration}</span>` : '🔄 Startet gleich'}
                            </div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="table-card available">
                            <div class="table-nr">🏓 Tisch ${t}</div>
                            <div class="table-empty">🟢 Frei</div>
                        </div>
                    `;
                }
            }
            html += `</div>`;

            // Match Historie (letzte 5 beendete Spiele)
            const recentMatches = state.matches
                .filter(m => m.bewerb === bewerbName && m.is_played)
                .sort((a, b) => new Date(b.end_time) - new Date(a.end_time))
                .slice(0, 5);

            if (recentMatches.length > 0) {
                html += `<div class="history-list"><h4>⏱️ Zuletzt beendet</h4>`;
                recentMatches.forEach(m => {
                    const details = m.set_details && m.set_details !== '-' ? `(${esc(m.set_details)})` : '';
                    html += `
                        <div class="history-item">
                            <span class="h-players">${esc(m.player1_name)} vs ${esc(m.player2_name)}</span>
                            <span class="h-result">${m.sets_p1 || 0}:${m.sets_p2 || 0} ${details}</span>
                            <span class="h-round">${esc(m.round_name)}</span>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            container.innerHTML = html;

            if (activeMatches.length > 0 && !window._liveTimer) {
                window._liveTimer = setInterval(() => renderLive(), 1000);
            } else if (activeMatches.length === 0 && window._liveTimer) {
                clearInterval(window._liveTimer);
                window._liveTimer = null;
            }
        }

        // ----- WARTESCHLANGE -----
        function renderQueue() {
            const container = containers.queue;
            if (!container) return;

            const bewerbName = state.selectedBewerb;
            if (!bewerbName) {
                container.innerHTML = `
                    <div style="text-align:center; padding:30px 0; color:var(--text-muted);">
                        Bitte wähle einen Bewerb aus.
                    </div>
                `;
                return;
            }

            const queuedMatches = state.matches.filter(m =>
                m.bewerb === bewerbName &&
                !m.is_played &&
                m.queue_pos !== null &&
                m.queue_pos !== undefined
            ).sort((a, b) => (a.queue_pos || 999) - (b.queue_pos || 999));

            if (queuedMatches.length === 0) {
                container.innerHTML =
                    `<div style="text-align:center; padding:30px 0; color:var(--text-muted);">Die Warteschlange ist aktuell leer.</div>`;
                return;
            }

            let html = `<ul class="queue-list">`;
            queuedMatches.forEach(m => {
                const isFav = state.favoritePlayer &&
                    (m.player1_id === state.favoritePlayer.id || m.player2_id === state.favoritePlayer.id);
                html += `
                    <li>
                        <span class="queue-pos">#${m.queue_pos}</span>
                        <span>
                            ${esc(m.player1_name)} vs ${esc(m.player2_name)}
                            ${isFav ? ' <span class="queue-fav">⭐ Favorit</span>' : ''}
                        </span>
                        <span style="font-size:11px; color:var(--text-muted);">${esc(m.round_name)}</span>
                    </li>
                `;
            });
            html += `</ul>`;

            container.innerHTML = html;
        }

        // ----- TÖPFE -----
        function renderPots() {
            const container = containers.pots;
            if (!container) return;

            const bewerbName = state.selectedBewerb;
            if (!bewerbName) {
                container.innerHTML = `
                    <div style="text-align:center; padding:30px 0; color:var(--text-muted);">
                        Bitte wähle einen Bewerb aus.
                    </div>
                `;
                return;
            }

            const playersInBewerb = state.players.filter(p => {
                if (!p.bewerbe) return false;
                return p.bewerbe.split(',').some(b => b.trim() === bewerbName);
            });

            if (playersInBewerb.length < 8) {
                container.innerHTML =
                    `<div style="text-align:center; padding:30px 0; color:var(--text-muted);">Für Topf-Einteilung werden mindestens 8 Spieler benötigt. Aktuell: ${playersInBewerb.length}</div>`;
                return;
            }

            const sorted = [...playersInBewerb].sort((a, b) => (b.rc_points || 0) - (a.rc_points || 0));
            const count = sorted.length;
            const potSize = Math.floor(count / 4);

            const pots = { 1: [], 2: [], 3: [], 4: [] };
            sorted.forEach((p, idx) => {
                const seed = idx + 1;
                let potNum;
                if (seed <= potSize) potNum = 1;
                else if (seed <= 2 * potSize) potNum = 2;
                else if (seed <= 3 * potSize) potNum = 3;
                else potNum = 4;
                pots[potNum].push({ ...p, seed });
            });

            let html = `<div class="pot-grid">`;
            for (let i = 1; i <= 4; i++) {
                const pot = pots[i];
                const startSeed = (i - 1) * potSize + 1;
                const endSeed = i < 4 ? i * potSize : count;

                html += `
                    <div class="pot-card">
                        <div class="pot-title">
                            Topf ${i}
                            <span class="seed-range">(Setzung ${startSeed}–${endSeed})</span>
                        </div>
                `;

                pot.forEach(p => {
                    const isFav = state.favoritePlayer && p.id === state.favoritePlayer.id;
                    html += `
                        <div class="pot-player">
                            <span class="seed">#${p.seed}</span>
                            <span class="${isFav ? 'fav' : ''}">${isFav ? '⭐ ' : ''}${esc(p.name)}</span>
                            <span style="color:var(--text-muted); font-size:11px;">${esc(p.rc_points || '?')} RC</span>
                        </div>
                    `;
                });

                html += `</div>`;
            }
            html += `</div>`;

            container.innerHTML = html;
        }

        // ----- STATS -----
        function renderStats() {
            const container = containers.stats;
            if (!container) return;

            const bewerbName = state.selectedBewerb;
            if (!bewerbName) {
                container.innerHTML = `
                    <div style="text-align:center; padding:30px 0; color:var(--text-muted);">
                        Bitte wähle einen Bewerb aus.
                    </div>
                `;
                return;
            }

            const playersInBewerb = state.players.filter(p => {
                if (!p.bewerbe) return false;
                return p.bewerbe.split(',').some(b => b.trim() === bewerbName);
            });

            const matchesInBewerb = state.matches.filter(m => m.bewerb === bewerbName);
            const playedMatches = matchesInBewerb.filter(m => m.is_played);
            const ranking = calculateRanking(playersInBewerb, matchesInBewerb);

            if (playedMatches.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center; padding:30px 0; color:var(--text-muted);">
                        Noch keine beendeten Spiele für Statistiken.
                    </div>
                `;
                return;
            }

            // --- STATS BERECHNEN ---
            let totalSets = 0,
                totalBalls = 0;
            let count30 = 0,
                count31 = 0,
                count32 = 0;
            let countReverseSweeps = 0,
                countDonut = 0;
            let allDurations = [];
            let playerTimes = {};
            let playerMatchesCount = {};
            let upsetList = [];
            let playerWins = {};
            let playerDonuts = {};
            let playerSweeps = {};
            let playerFiveSets = {};
            let setScores = {};

            playedMatches.forEach(m => {
                const s1 = m.sets_p1 || 0;
                const s2 = m.sets_p2 || 0;
                totalSets += s1 + s2;
                totalBalls += (m.points_p1 || 0) + (m.points_p2 || 0);

                if (s1 + s2 === 3) count30++;
                else if (s1 + s2 === 4) count31++;
                else if (s1 + s2 >= 5) count32++;

                if ((s1 === 3 && s2 === 2) || (s2 === 3 && s1 === 2)) {
                    if (m.set_details && m.set_details !== '-') {
                        const sets = m.set_details.split(',');
                        if (sets.length >= 5) {
                            const p1Sets = sets.map(s => parseInt(s.split(':')[0]) > parseInt(s.split(':')[1]) ? 1 :
                                0);
                            const p1FirstTwo = p1Sets[0] + p1Sets[1];
                            if (p1FirstTwo === 0 && s1 === 3) countReverseSweeps++;
                            else if (p1FirstTwo === 2 && s2 === 3) countReverseSweeps++;
                        }
                    }
                }

                if (m.set_details && m.set_details !== '-') {
                    const sets = m.set_details.split(',');
                    sets.forEach(s => {
                        const trimmed = s.trim();
                        if (trimmed === '11:0' || trimmed === '0:11') {
                            countDonut++;
                            const winnerId = trimmed === '11:0' ? m.player1_id : m.player2_id;
                            playerDonuts[winnerId] = (playerDonuts[winnerId] || 0) + 1;
                        }
                        setScores[trimmed] = (setScores[trimmed] || 0) + 1;
                    });
                }

                const durSec = parseDurationToSeconds(m.duration_str);
                if (durSec > 0) {
                    allDurations.push({ sec: durSec, p1: m.player1_name, p2: m.player2_name, score: `${s1}:${s2}` });
                    playerTimes[m.player1_id] = (playerTimes[m.player1_id] || 0) + durSec;
                    playerTimes[m.player2_id] = (playerTimes[m.player2_id] || 0) + durSec;
                    playerMatchesCount[m.player1_id] = (playerMatchesCount[m.player1_id] || 0) + 1;
                    playerMatchesCount[m.player2_id] = (playerMatchesCount[m.player2_id] || 0) + 1;
                }

                if (s1 > s2) {
                    playerWins[m.player1_id] = (playerWins[m.player1_id] || 0) + 1;
                } else if (s2 > s1) {
                    playerWins[m.player2_id] = (playerWins[m.player2_id] || 0) + 1;
                }

                if (s1 === 3 && s2 === 0) {
                    playerSweeps[m.player1_id] = (playerSweeps[m.player1_id] || 0) + 1;
                } else if (s2 === 3 && s1 === 0) {
                    playerSweeps[m.player2_id] = (playerSweeps[m.player2_id] || 0) + 1;
                }

                if (s1 + s2 >= 5) {
                    playerFiveSets[m.player1_id] = (playerFiveSets[m.player1_id] || 0) + 1;
                    playerFiveSets[m.player2_id] = (playerFiveSets[m.player2_id] || 0) + 1;
                }

                const p1 = state.players.find(p => p.id === m.player1_id);
                const p2 = state.players.find(p => p.id === m.player2_id);
                if (p1 && p2 && p1.rc_points > 0 && p2.rc_points > 0) {
                    if (s1 > s2 && p1.rc_points < p2.rc_points) {
                        upsetList.push({
                            winner: p1.name, loser: p2.name, wRc: p1.rc_points, lRc: p2.rc_points,
                            diff: p2.rc_points - p1.rc_points, score: `${s1}:${s2}`
                        });
                    } else if (s2 > s1 && p2.rc_points < p1.rc_points) {
                        upsetList.push({
                            winner: p2.name, loser: p1.name, wRc: p2.rc_points, lRc: p1.rc_points,
                            diff: p1.rc_points - p2.rc_points, score: `${s2}:${s1}`
                        });
                    }
                }
            });

            const avgDuration = allDurations.length > 0 ? allDurations.reduce((sum, d) => sum + d.sec, 0) / allDurations
                .length : 0;

            const sortedDurations = [...allDurations].sort((a, b) => b.sec - a.sec);
            const longest5 = sortedDurations.slice(0, 5);
            const shortest5 = sortedDurations.slice(-5).reverse();

            const playerAvgTimes = Object.entries(playerTimes).map(([id, total]) => {
                const p = state.players.find(p => String(p.id) === String(id));
                const matches = playerMatchesCount[id] || 0;
                return {
                    name: p ? p.name : 'Unbekannt',
                    avg: matches > 0 ? total / matches : 0,
                    matches: matches
                };
            }).filter(p => p.avg > 0 && p.matches > 0);

            const fastest = [...playerAvgTimes].sort((a, b) => a.avg - b.avg).slice(0, 5);
            const slowest = [...playerAvgTimes].sort((a, b) => b.avg - a.avg).slice(0, 5);

            const topWins = Object.entries(playerWins)
                .map(([id, wins]) => {
                    const p = state.players.find(p => String(p.id) === String(id));
                    return { name: p ? p.name : 'Unbekannt', wins };
                })
                .sort((a, b) => b.wins - a.wins)
                .slice(0, 5);

            const topDonuts = Object.entries(playerDonuts)
                .map(([id, count]) => {
                    const p = state.players.find(p => String(p.id) === String(id));
                    return { name: p ? p.name : 'Unbekannt', count };
                })
                .sort((a, b) => b.count - a.count)
                .slice(0, 5);

            const topSweeps = Object.entries(playerSweeps)
                .map(([id, count]) => {
                    const p = state.players.find(p => String(p.id) === String(id));
                    return { name: p ? p.name : 'Unbekannt', count };
                })
                .sort((a, b) => b.count - a.count)
                .slice(0, 5);

            const topFiveSets = Object.entries(playerFiveSets)
                .map(([id, count]) => {
                    const p = state.players.find(p => String(p.id) === String(id));
                    return { name: p ? p.name : 'Unbekannt', count };
                })
                .sort((a, b) => b.count - a.count)
                .slice(0, 5);

            const topSetScores = Object.entries(setScores)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5);

            const biggestUpset = upsetList.length > 0 ? upsetList.reduce((a, b) => a.diff > b.diff ? a : b) : null;

            let html = `
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-label">Beendete Spiele</div><div class="stat-value">${playedMatches.length}</div></div>
                    <div class="stat-card"><div class="stat-label">Gespielte Sätze</div><div class="stat-value">${totalSets}</div></div>
                    <div class="stat-card"><div class="stat-label">Gespielte Bälle</div><div class="stat-value">${totalBalls}</div></div>
                    <div class="stat-card"><div class="stat-label">Ø Spieldauer</div><div class="stat-value">${formatDurationSeconds(avgDuration)}</div></div>
                    <div class="stat-card"><div class="stat-label">3:0 Siege</div><div class="stat-value warning">${count30}</div></div>
                    <div class="stat-card"><div class="stat-label">3:1 Siege</div><div class="stat-value">${count31}</div></div>
                    <div class="stat-card"><div class="stat-label">3:2 Krimis</div><div class="stat-value warning">${count32}</div></div>
                    <div class="stat-card"><div class="stat-label">2:0 auf 2:3</div><div class="stat-value success">${countReverseSweeps}</div></div>
                    <div class="stat-card"><div class="stat-label">11:0 Sätze</div><div class="stat-value error">${countDonut}</div></div>
                    <div class="stat-card"><div class="stat-label">Teilnehmer</div><div class="stat-value">${playersInBewerb.length}</div></div>
                </div>
            `;

            if (biggestUpset) {
                html += `
                    <div style="background:var(--bg-panel); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:14px; text-align:center;">
                        <div style="font-size:10px; text-transform:uppercase; color:var(--text-muted); letter-spacing:0.06em;">😱 Größtes Upset</div>
                        <div style="font-size:15px; font-weight:600; margin-top:4px;">
                            ${esc(biggestUpset.winner)} (${biggestUpset.wRc} RC) schlägt ${esc(biggestUpset.loser)} (${biggestUpset.lRc} RC) mit ${biggestUpset.score}
                            <span style="font-size:11px; color:var(--text-muted); font-weight:400;"> (Differenz ${biggestUpset.diff} RC)</span>
                        </div>
                    </div>
                `;
            }

            html += `<div class="stats-2col">`;

            html += `<div class="stats-box"><h4>🐢 Längste Matches</h4><ul>`;
            longest5.forEach((d, i) => {
                html +=
                    `<li><span>${i + 1}. ${esc(d.p1)} vs ${esc(d.p2)}</span><span class="highlight">${formatDurationSeconds(d.sec)}</span></li>`;
            });
            html += `</ul></div>`;

            html += `<div class="stats-box"><h4>⚡ Kürzeste Matches</h4><ul>`;
            shortest5.forEach((d, i) => {
                html +=
                    `<li><span>${i + 1}. ${esc(d.p1)} vs ${esc(d.p2)}</span><span class="highlight">${formatDurationSeconds(d.sec)}</span></li>`;
            });
            html += `</ul></div>`;

            html += `<div class="stats-box"><h4>🏃 Schnellste Spieler (Ø pro Match)</h4><ul>`;
            if (fastest.length > 0) {
                fastest.forEach((p, i) => {
                    html +=
                        `<li><span>${i + 1}. ${esc(p.name)}</span><span class="highlight">${formatDurationSeconds(p.avg)}</span></li>`;
                });
            } else {
                html += `<li style="color:var(--text-muted);">Noch keine Daten</li>`;
            }
            html += `</ul></div>`;

            html += `<div class="stats-box"><h4>🐌 Langsamste Spieler (Ø pro Match)</h4><ul>`;
            if (slowest.length > 0) {
                slowest.forEach((p, i) => {
                    html +=
                        `<li><span>${i + 1}. ${esc(p.name)}</span><span class="highlight">${formatDurationSeconds(p.avg)}</span></li>`;
                });
            } else {
                html += `<li style="color:var(--text-muted);">Noch keine Daten</li>`;
            }
            html += `</ul></div>`;

            html += `</div>`;

            html += `<div class="stats-2col" style="margin-top:14px;">`;

            html += `<div class="stats-box"><h4>🏆 Meiste Siege</h4><ul>`;
            if (topWins.length > 0) {
                topWins.forEach((p, i) => {
                    html += `<li><span>${i + 1}. ${esc(p.name)}</span><span class="highlight">${p.wins}</span></li>`;
                });
            } else {
                html += `<li style="color:var(--text-muted);">Keine Daten</li>`;
            }
            html += `</ul></div>`;

            html += `<div class="stats-box"><h4>🍩 Meiste 11:0 Sätze</h4><ul>`;
            if (topDonuts.length > 0) {
                topDonuts.forEach((p, i) => {
                    html +=
                        `<li><span>${i + 1}. ${esc(p.name)}</span><span class="highlight">${p.count}</span></li>`;
                });
            } else {
                html += `<li style="color:var(--text-muted);">Keine 11:0 Sätze</li>`;
            }
            html += `</ul></div>`;

            html += `<div class="stats-box"><h4>💪 Meiste 3:0 Siege</h4><ul>`;
            if (topSweeps.length > 0) {
                topSweeps.forEach((p, i) => {
                    html +=
                        `<li><span>${i + 1}. ${esc(p.name)}</span><span class="highlight">${p.count}</span></li>`;
                });
            } else {
                html += `<li style="color:var(--text-muted);">Keine Daten</li>`;
            }
            html += `</ul></div>`;

            html += `<div class="stats-box"><h4>🎯 Meiste 5-Satz-Krimis</h4><ul>`;
            if (topFiveSets.length > 0) {
                topFiveSets.forEach((p, i) => {
                    html +=
                        `<li><span>${i + 1}. ${esc(p.name)}</span><span class="highlight">${p.count}</span></li>`;
                });
            } else {
                html += `<li style="color:var(--text-muted);">Keine Daten</li>`;
            }
            html += `</ul></div>`;

            html += `<div class="stats-box"><h4>🎯 Häufigste Satz-Ergebnisse</h4><ul>`;
            if (topSetScores.length > 0) {
                topSetScores.forEach(([score, count]) => {
                    html += `<li><span>${esc(score)}</span><span class="highlight">${count}x</span></li>`;
                });
            } else {
                html += `<li style="color:var(--text-muted);">Keine Daten</li>`;
            }
            html += `</ul></div>`;

            html += `</div>`;

            container.innerHTML = html;
        }

        // ----- SYSTEM-ERKLÄRUNG -----
        function renderSystem() {
            const container = containers.system;
            if (!container) return;

            container.innerHTML = `
                <div class="system-box">
                    <h3>🏓 Das Turniersystem</h3>

                            <span class="highlight">Minitabelle (Direktes Duell):</span> <strong>Nur wenn alle Spieler einer aktuellen Vergleichsgruppe (z.B. gleiche Siege, gleiches Satzverhältnis etc.) tatsächlich gegeneinander gespielt haben</strong>, wird eine interne Minitabelle (Vergleich der Partien untereinander) herangezogen. Der Sieger dieser Minitabelle wird vorgereiht (in der Tabelle mit <strong>⚔️</strong> markiert). Die Minitabelle wird ihrerseits mit denselben Kriterien (Mini-Siege, Mini-SV, Mini-BV, RC) aufgelöst.

                        </li>
                        <li>
                            <span class="highlight">Ballverhältnis (BV):</span> Das Verhältnis aus gewonnenen zu verlorenen Punkten.
                        </li>

                            <span class="highlight">RC-Rating:</span> Der Spieler mit dem niedrigeren RC-Rating wird bei weiterhin gleichen Werten vorgereiht.
                        </li>
                    </ol>
                    <p class="note">
                        💡 <strong>Hinweis:</strong> Das direkte Duell wird immer dann als Tie-Breaker herangezogen, wenn <strong>alle</strong> Spieler einer aktuellen Vergleichsgruppe tatsächlich gegeneinander gespielt haben – unabhängig von der Gruppengröße. Dies wird auf jeder Stufe (Siege, SV, BV, RC) überprüft.
                    </p>
                </div>
            `;
        }

        // ----- BEWERBE DROPDOWN -----
        function populateBewerbSelect() {
            bewerbSelect.innerHTML = '';
            if (state.bewerbe.length === 0) {
                bewerbSelect.innerHTML = '<option value="">Keine Bewerbe</option>';
                return;
            }

            state.bewerbe.forEach(b => {
                const opt = document.createElement('option');
                opt.value = b.name;
                opt.textContent = b.name;
                if (b.name === state.selectedBewerb) {
                    opt.selected = true;
                }
                bewerbSelect.appendChild(opt);
            });
        }

        // ============================================================
        // STATUS
        // ============================================================
        function setStatus(type, text) {
            statusDot.className = 'dot';
            if (type === 'online') statusDot.classList.add('online');
            else if (type === 'offline') statusDot.classList.add('offline');
            else if (type === 'loading') statusDot.classList.add('loading');
            statusText.textContent = text;
        }

        // ============================================================
        // TABS
        // ============================================================
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                const tabId = btn.dataset.tab;
                const content = document.getElementById(`tab-${tabId}`);
                if (content) content.classList.add('active');
                document.querySelector('.tabs-wrapper').scrollLeft = 0;
            });
        });

        // ============================================================
        // EVENTS
        // ============================================================

        bewerbSelect.addEventListener('change', () => {
            state.selectedBewerb = bewerbSelect.value;
            if (state.selectedBewerb) {
                localStorage.setItem('last_bewerb', state.selectedBewerb);
            }
            renderAll();
        });

        favInput.addEventListener('change', () => {
            const query = favInput.value.toLowerCase().trim();
            if (!query) {
                state.favoritePlayer = null;
                const url = new URL(window.location);
                url.searchParams.delete('fav');
                window.history.replaceState({}, '', url);
                renderAll();
                return;
            }

            const found = state.players.find(p => p.name.toLowerCase().includes(query));
            if (found) {
                state.favoritePlayer = found;
                const url = new URL(window.location);
                url.searchParams.set('fav', found.id);
                window.history.replaceState({}, '', url);
                favInput.value = found.name;
                renderAll();
            } else {
                showToast('Spieler nicht gefunden.', true);
            }
        });

        refreshBtn.addEventListener('click', async () => {
            refreshBtn.disabled = true;
            refreshBtn.textContent = '🔄 Lade...';
            await loadData();
            refreshBtn.textContent = '🔄 Aktualisieren';
            refreshBtn.disabled = false;
            showToast('Daten aktualisiert!');
        });

        document.addEventListener('input', (e) => {
