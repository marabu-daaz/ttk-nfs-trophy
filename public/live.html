<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Live-Ticker - NFS Trophy</title>
    <meta name="description" content="Live-Ticker, Tabelle und Spielplan der NFS Trophy." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet" />

    <style>
        /* ==========================================
           GLOBALE STYLES - Grün Theme mit Dark/Light
        ========================================== */
        :root {
            --bg-body: #0a1a0f;
            --bg-panel: #0f2416;
            --bg-card: #14301a;
            --bg-hover: #1a3d22;
            --border: rgba(90, 200, 120, 0.12);
            --border-strong: rgba(90, 200, 120, 0.25);
            --text-main: #e8f5ec;
            --text-muted: rgba(200, 240, 210, 0.55);
            --text-dim: rgba(200, 240, 210, 0.3);
            --accent: #4caf7a;
            --accent-light: rgba(76, 175, 122, 0.15);
            --success: #66bb8a;
            --error: #ef5350;
            --warning: #ffd54f;
            --line: rgba(90, 200, 120, 0.08);
            --shadow: rgba(0, 0, 0, 0.3);
            --scroll-bg: #0a1a0f;
            --scroll-thumb: #1a3d22;
        }

        [data-theme="light"] {
            --bg-body: #f0f7f2;
            --bg-panel: #ffffff;
            --bg-card: #f5faf7;
            --bg-hover: #e8f5ec;
            --border: rgba(30, 60, 40, 0.12);
            --border-strong: rgba(30, 60, 40, 0.25);
            --text-main: #1a2e22;
            --text-muted: rgba(30, 60, 40, 0.55);
            --text-dim: rgba(30, 60, 40, 0.3);
            --accent: #2e7d5e;
            --accent-light: rgba(46, 125, 94, 0.12);
            --shadow: rgba(0, 0, 0, 0.08);
            --scroll-bg: #f0f7f2;
            --scroll-thumb: #b8d5c4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Stats-Tab ausblenden */
        .live-tabs .tab-btn[data-tab="stats"] {
            display: none;
        }

        /* Stats-Content ausblenden */
        #tab-stats {
            display: none !important;
        }

        body {
            background: var(--bg-body);
            color: var(--text-main);
            font-family: 'Inter', system-ui, sans-serif;
            font-weight: 300;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        ::selection {
            background: var(--accent);
            color: #fff;
        }

        .wrap {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 clamp(12px, 3vw, 40px);
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--scroll-bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--scroll-thumb);
            border-radius: 3px;
        }

        /* ----- NAVIGATION ----- */
        nav {
            position: sticky;
            top: 0;
            z-index: 50;
            background: var(--bg-body);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 2px 20px var(--shadow);
            transition: background 0.3s;
        }

        nav .inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px clamp(12px, 3vw, 40px);
            max-width: 1200px;
            margin: 0 auto;
            gap: 8px;
            flex-wrap: wrap;
        }

        nav .logo {
            display: inline-flex;
            align-items: center;
            height: 36px;
            text-decoration: none;
            color: var(--text-main);
            gap: 8px;
        }

        nav .logo img {
            height: 32px;
            width: auto;
            display: block;
        }

        .nav-title {
            font-family: 'Archivo', sans-serif;
            font-weight: 700;
            font-size: 16px;
            color: var(--accent);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-toggle {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            font-family: inherit;
        }

        .theme-toggle:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ==========================================
           LIVE-TICKER SPEZIFISCHE STYLES
        ========================================== */
        .live-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin: 16px 0 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .live-header .title h1 {
            font-family: 'Archivo', sans-serif;
            font-weight: 700;
            font-size: clamp(1.4rem, 3.5vw, 2.4rem);
            line-height: 1.1;
            letter-spacing: -0.03em;
        }

        .live-header .title h1 em {
            font-style: normal;
            color: var(--accent);
        }

        .live-header .status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .live-header .status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
            animation: pulse-dot 1.5s ease-in-out infinite;
        }

        @keyframes pulse-dot {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.5;
                transform: scale(0.8);
            }
        }

        .live-header .status .dot.offline {
            background: var(--text-muted);
            animation: none;
        }

        .live-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .live-controls select,
        .live-controls input {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 8px;
            outline: none;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            min-width: 140px;
            transition: border-color 0.2s;
        }

        .live-controls select:focus,
        .live-controls input:focus {
            border-color: var(--accent);
        }

        .live-controls select option {
            background: var(--bg-panel);
        }

        .live-controls .refresh-btn {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            font-family: inherit;
        }

        .live-controls .refresh-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .live-controls .refresh-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ----- TABS ----- */
        .tabs-wrapper {
            position: relative;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            margin-bottom: 16px;
        }

        .tabs-wrapper::-webkit-scrollbar {
            display: none;
        }

        .live-tabs {
            display: flex;
            gap: 4px;
            background: var(--bg-panel);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--border);
            min-width: max-content;
        }

        .live-tabs .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
            border-radius: 8px;
            flex: 0 0 auto;
            text-align: center;
            white-space: nowrap;
        }

        .live-tabs .tab-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
        }

        .live-tabs .tab-btn.active {
            color: #fff;
            background: var(--accent);
            box-shadow: 0 4px 16px rgba(76, 175, 122, 0.25);
        }

        .swipe-indicator {
            display: none;
            text-align: center;
            font-size: 11px;
            color: var(--text-dim);
            padding: 4px 0 8px;
            letter-spacing: 0.06em;
        }

        @media (max-width: 768px) {
            .swipe-indicator {
                display: block;
            }

            .live-tabs .tab-btn {
                padding: 6px 10px;
                font-size: 11px;
            }
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ----- TABELLE ----- */
        .table-toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px;
            align-items: center;
        }

        .table-toolbar input {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 8px;
            outline: none;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            flex: 1;
            min-width: 150px;
            transition: border-color 0.2s;
        }

        .table-toolbar input:focus {
            border-color: var(--accent);
        }

        .table-wrap {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg-panel);
        }

        .live-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 400px;
        }

        .live-table th {
            text-align: left;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-muted);
            font-weight: 600;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            border-bottom: 2px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .live-table td {
            padding: 9px 12px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
            color: var(--text-main);
            cursor: pointer;
            transition: background 0.2s;
            font-size: 13px;
        }

        .live-table tr:last-child td {
            border-bottom: none;
        }

        .live-table tr:hover td {
            background: var(--bg-hover);
        }

        .live-table tbody tr:nth-child(even) td {
            background: rgba(255, 255, 255, 0.02);
        }

        .live-table tbody tr:nth-child(even):hover td {
            background: var(--bg-hover);
        }

        .live-table .rank {
            font-weight: 600;
            font-family: 'Archivo', sans-serif;
            color: var(--text-muted);
            width: 32px;
            text-align: center;
            font-size: 13px;
        }

        .live-table .rank.gold {
            color: #fbbf24;
        }

        .live-table .rank.silver {
            color: #94a3b8;
        }

        .live-table .rank.bronze {
            color: #cd7f32;
        }

        .live-table .name {
            font-weight: 500;
            white-space: nowrap;
        }

        .live-table .verein {
            color: var(--text-muted);
            font-size: 11px;
        }

        .live-table .stats {
            text-align: center;
            font-variant-numeric: tabular-nums;
            font-size: 12px;
        }

        .live-table .highlight-fav {
            background: rgba(76, 175, 122, 0.15) !important;
            border-left: 3px solid var(--accent);
        }

        .live-table .highlight-fav td {
            background: rgba(76, 175, 122, 0.10) !important;
        }

        .live-table .highlight-fav:hover td {
            background: rgba(76, 175, 122, 0.20) !important;
        }

        /* ----- SPIELPLAN (Mein Plan) ----- */
        .match-card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            transition: border-color 0.2s, background 0.2s;
        }

        .match-card:hover {
            border-color: var(--border-strong);
            background: var(--bg-hover);
        }

        .match-card .match-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
            min-width: 140px;
        }

        .match-card .match-info .round {
            font-size: 11px;
            color: var(--text-muted);
        }

        .match-card .match-info .players {
            font-size: 14px;
            font-weight: 500;
        }

        .match-card .match-info .players .vs {
            color: var(--text-muted);
            font-weight: 300;
            margin: 0 6px;
        }

        .match-card .match-status {
            font-size: 11px;
            font-weight: 500;
            padding: 3px 12px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .match-card .match-status.played {
            color: var(--success);
            background: rgba(102, 187, 138, 0.12);
            border: 1px solid rgba(102, 187, 138, 0.2);
        }

        .match-card .match-status.running {
            color: var(--warning);
            background: rgba(255, 213, 79, 0.12);
            border: 1px solid rgba(255, 213, 79, 0.2);
        }

        .match-card .match-status.queue {
            color: var(--accent);
            background: var(--accent-light);
            border: 1px solid rgba(76, 175, 122, 0.15);
        }

        .match-card .match-status.open {
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
        }

        .match-card .match-result {
            font-weight: 600;
            font-family: 'Archivo', sans-serif;
            font-size: 17px;
            color: var(--text-main);
        }

        .match-card .match-result.win {
            color: var(--success);
        }

        .match-card .match-result.loss {
            color: var(--error);
        }

        .match-card .match-details {
            font-size: 11px;
            color: var(--text-muted);
        }

        .match-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 3px;
        }

        @media (max-width: 600px) {
            .match-card {
                flex-direction: column;
                align-items: stretch;
                gap: 4px;
            }

            .match-card .match-info {
                flex: 1;
                min-width: unset;
            }

            .match-card .match-info .round {
                font-size: 10px;
                color: var(--text-muted);
                order: 3;
                text-align: right;
            }

            .match-card .match-info .players {
                font-size: 13px;
                order: 1;
            }

            .match-right {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                width: 100%;
                flex-wrap: wrap;
            }

            .match-card .match-status {
                order: 2;
                align-self: flex-start;
            }

            .match-card .match-result {
                font-size: 15px;
            }

            .match-card .match-details {
                text-align: left;
                font-size: 10px;
            }
        }

        /* ----- PLAYER STATS DASHBOARD ----- */
        .player-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
            gap: 8px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 16px;
        }

        .player-stats .stat-item {
            text-align: center;
        }

        .player-stats .stat-item .label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
        }

        .player-stats .stat-item .value {
            font-family: 'Archivo', sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: var(--accent);
            margin-top: 2px;
        }

        .player-stats .stat-item .value.gold {
            color: #fbbf24;
        }

        .player-stats .stat-item .value.silver {
            color: #94a3b8;
        }

        .player-stats .stat-item .value.bronze {
            color: #cd7f32;
        }

        .player-stats .stat-item .value.win {
            color: var(--success);
        }

        .player-stats .stat-item .value.loss {
            color: var(--error);
        }

        .player-info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
            padding: 6px 12px;
            background: var(--bg-body);
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 13px;
        }

        .player-info-row .pot-info {
            color: var(--accent);
        }

        /* ----- LIVE TISCH ----- */
        .table-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
        }

        .table-card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .table-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--border-strong);
            transition: background 0.3s;
        }

        .table-card.running::before {
            background: var(--warning);
            box-shadow: 0 0 20px rgba(255, 213, 79, 0.3);
        }

        .table-card.available::before {
            background: var(--text-muted);
            opacity: 0.2;
        }

        .table-card:hover {
            border-color: var(--border-strong);
            transform: translateY(-2px);
        }

        .table-card .table-nr {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .table-card .table-players {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 3px;
        }

        .table-card .table-players .vs {
            color: var(--text-muted);
            font-weight: 300;
            margin: 0 4px;
        }

        .table-card .table-time {
            font-size: 12px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            font-family: 'Archivo', monospace;
        }

        .table-card .table-time .running-time {
            color: var(--warning);
            font-weight: 600;
        }

        .table-card .table-empty {
            color: var(--text-muted);
            font-size: 13px;
            padding: 3px 0;
        }

        .table-card .fav-badge {
            display: inline-block;
            background: var(--accent);
            color: #000;
            font-size: 9px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 10px;
            margin-left: 4px;
            vertical-align: middle;
        }

        /* ----- MATCH HISTORIE (Live-Tab) ----- */
        .history-list {
            margin-top: 16px;
        }

        .history-list h4 {
            font-family: 'Archivo', sans-serif;
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            flex-wrap: wrap;
            gap: 4px;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-item .h-players {
            font-weight: 500;
            flex: 1;
            min-width: 120px;
        }

        .history-item .h-result {
            font-weight: 600;
            color: var(--accent);
            text-align: center;
            min-width: 100px;
        }

        .history-item .h-round {
            font-size: 11px;
            color: var(--text-muted);
            text-align: right;
        }

        @media (max-width: 600px) {
            .history-item {
                flex-direction: column;
                align-items: stretch;
                gap: 2px;
            }

            .history-item .h-players {
                font-size: 12px;
                min-width: unset;
            }

            .history-item .h-result {
                text-align: left;
                font-size: 12px;
                min-width: unset;
            }

            .history-item .h-round {
                text-align: left;
                font-size: 10px;
            }
        }

        /* ----- WARTESCHLANGE ----- */
        .queue-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .queue-list li {
            padding: 8px 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            background: var(--bg-panel);
            border-radius: 8px;
            margin-bottom: 4px;
            transition: background 0.2s;
        }

        .queue-list li:hover {
            background: var(--bg-hover);
        }

        .queue-list li:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .queue-list .queue-pos {
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            min-width: 30px;
        }

        .queue-list .queue-fav {
            color: var(--accent);
            font-weight: 600;
        }

        /* ----- TÖPFE ----- */
        .pot-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 12px;
        }

        .pot-card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
            transition: border-color 0.2s;
        }

        .pot-card:hover {
            border-color: var(--border-strong);
        }

        .pot-card .pot-title {
            font-family: 'Archivo', sans-serif;
            font-weight: 600;
            font-size: 15px;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .pot-card .pot-title .seed-range {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 400;
        }

        .pot-card .pot-player {
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            align-items: center;
        }

        .pot-card .pot-player:last-child {
            border-bottom: none;
        }

        .pot-card .pot-player .seed {
            color: var(--text-muted);
            font-size: 11px;
            min-width: 26px;
        }

        .pot-card .pot-player .fav {
            color: var(--accent);
            font-weight: 600;
        }

        /* ----- STATS ----- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px var(--shadow);
        }

        .stat-card .stat-label {
            font-size: 9px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.06em;
        }

        .stat-card .stat-value {
            font-family: 'Archivo', sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: var(--accent);
            margin-top: 2px;
        }

        .stat-card .stat-value.warning {
            color: var(--warning);
        }

        .stat-card .stat-value.success {
            color: var(--success);
        }

        .stat-card .stat-value.error {
            color: var(--error);
        }

        .stats-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 14px;
        }

        @media (max-width: 768px) {
            .stats-2col {
                grid-template-columns: 1fr;
            }
        }

        .stats-box {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
        }

        .stats-box h4 {
            font-family: 'Archivo', sans-serif;
            font-size: 14px;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .stats-box ul {
            list-style: none;
            padding: 0;
        }

        .stats-box ul li {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid var(--border);
            font-size: 12px;
        }

        .stats-box ul li:last-child {
            border-bottom: none;
        }

        .stats-box ul li .highlight {
            color: var(--accent);
            font-weight: 500;
            font-family: 'Archivo', monospace;
        }

        /* ----- SYSTEM-ERKLÄRUNG ----- */
        .system-box {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            max-width: 800px;
        }

        .system-box h3 {
            font-family: 'Archivo', sans-serif;
            font-weight: 600;
            font-size: 18px;
            margin-bottom: 10px;
            color: var(--accent);
        }

        .system-box p {
            color: var(--text-muted);
            line-height: 1.7;
            margin-bottom: 14px;
            font-size: 14px;
        }

        .system-box ol {
            color: var(--text-muted);
            line-height: 1.8;
            padding-left: 18px;
            font-size: 14px;
        }

        .system-box ol li {
            margin-bottom: 3px;
        }

        .system-box .highlight {
            color: var(--text-main);
            font-weight: 500;
        }

        .system-box .note {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 12px;
        }

        /* ----- LOADING ----- */
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 0;
            color: var(--text-muted);
            gap: 10px;
            font-size: 14px;
        }

        .loading-spinner .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid var(--border);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ----- TOAST ----- */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 320px;
        }

        .toast {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            line-height: 1.5;
            box-shadow: 0 10px 40px var(--shadow);
            animation: slideIn 0.3s ease forwards;
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            background: var(--bg-panel);
            color: var(--text-main);
        }

        .toast:not(.error) {
            border-left: 4px solid var(--success);
        }

        .toast.error {
            border-left: 4px solid var(--error);
        }

        @keyframes slideIn {
            from {
                transform: translateX(120%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: translateY(-10px);
            }
        }

        .toast.fade-out {
            animation: fadeOut 0.3s ease forwards;
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 768px) {
            .live-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
                margin: 12px 0 16px;
            }

            .live-controls {
                flex-direction: column;
            }

            .live-controls select,
            .live-controls input {
                width: 100%;
                min-width: unset;
            }

            .table-grid {
                grid-template-columns: 1fr 1fr;
            }

            .pot-grid {
                grid-template-columns: 1fr 1fr;
            }

            .player-stats {
                grid-template-columns: repeat(3, 1fr);
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            nav .inner {
                padding: 8px 12px;
            }

            .nav-title {
                font-size: 14px;
            }

            .theme-toggle {
                padding: 4px 10px;
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .live-table {
                font-size: 11px;
                min-width: 380px;
            }

            .live-table th,
            .live-table td {
                padding: 6px 8px;
            }

            .player-stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .table-grid {
                grid-template-columns: 1fr;
            }

            .pot-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }

            .live-header .title h1 {
                font-size: 1.2rem;
            }

            .live-tabs .tab-btn {
                padding: 5px 10px;
                font-size: 10px;
            }
        }

        /* ----- PRINT STYLES ----- */
        @media print {

            nav,
            .live-controls,
            .table-toolbar,
            .refresh-btn,
            .theme-toggle,
            .live-tabs,
            .swipe-indicator {
                display: none !important;
            }

            .tab-content {
                display: block !important;
            }

            .tab-content:not(.active) {
                display: none !important;
            }

            .live-header .status .dot {
                animation: none !important;
            }

            body {
                background: white !important;
                color: black !important;
            }

            .table-wrap,
            .stat-card,
            .stats-box,
            .system-box {
                border-color: #ccc !important;
                background: white !important;
            }

            .live-table th {
                background: #f0f0f0 !important;
                color: black !important;
            }

            .live-table td {
                color: black !important;
            }

            .stat-card .stat-value {
                color: #2e7d5e !important;
            }
        }
    </style>
</head>

    <script type="module">
        // ============================================================
        // LIVE-TICKER - MIT SUPABASE PROJEKT B
        // ============================================================

        import { createClient } from "@supabase/supabase-js";
        import { SUPABASE_URL_B, SUPABASE_ANON_KEY_B } from "../config.js";

        console.log('✅ Config geladen:');
        console.log('SUPABASE_URL_B:', SUPABASE_URL_B);
        console.log('SUPABASE_ANON_KEY_B vorhanden:', !!SUPABASE_ANON_KEY_B);

        const supabase = createClient(SUPABASE_URL_B, SUPABASE_ANON_KEY_B);

        // ============================================================
        // STATE
        // ============================================================
        let state = {
            players: [],
            matches: [],
            settings: [],
            bewerbe: [],
            selectedBewerb: '',
            favoritePlayer: null,
            tournamentName: 'NFS Trophy',
            loading: false,
            lastUpdate: null,
            startTime: null,
            theme: 'dark',
        };

        // DOM refs
        const $ = (id) => document.getElementById(id);
        const bewerbSelect = $('bewerbSelect');
        const favInput = $('favPlayerInput');
        const refreshBtn = $('refreshBtn');
        const statusDot = $('statusDot');
        const statusText = $('statusText');
        const lastUpdateEl = $('lastUpdate');
        const tournamentNameEl = $('tournamentName');
        const themeToggle = $('themeToggle');

        const containers = {
            table: $('tableContainer'),
            meinplan: $('meinplanContainer'),
            live: $('liveContainer'),
            queue: $('queueContainer'),
            pots: $('potsContainer'),
            stats: $('statsContainer'),
            system: $('systemContainer'),
        };

        // ============================================================
        // THEME
        // ============================================================
        function loadTheme() {
            const saved = localStorage.getItem('theme') || 'dark';
            state.theme = saved;
            document.documentElement.setAttribute('data-theme', saved);
            themeToggle.textContent = saved === 'dark' ? '☀️' : '🌙';
        }

        function toggleTheme() {
            const newTheme = state.theme === 'dark' ? 'light' : 'dark';
            state.theme = newTheme;
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            themeToggle.textContent = newTheme === 'dark' ? '☀️' : '🌙';
        }

        themeToggle.addEventListener('click', toggleTheme);
        loadTheme();

        // ============================================================
        // HELPERS
        // ============================================================
        function esc(s) {
            if (s === null || s === undefined) return '';
            return String(s).replace(/[&<>"]/g, (c) => {
                const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
                return map[c] || c;
            });
        }

        function showToast(msg, isError = false) {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? 'error' : ''}`;
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('fade-out');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        function formatDuration(startIso) {
            if (!startIso) return '';
            const start = new Date(startIso);
            const now = new Date();
            const diff = Math.floor((now - start) / 1000);
            if (diff < 0) return '';
            const hours = Math.floor(diff / 3600);
            const minutes = Math.floor((diff % 3600) / 60);
            const seconds = diff % 60;
            if (hours > 0) {
                return `${hours}h ${String(minutes).padStart(2, '0')}m ${String(seconds).padStart(2, '0')}s`;
            }
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function formatDurationSeconds(sec) {
            if (!sec || sec <= 0) return '0:00';
            const hours = Math.floor(sec / 3600);
            const minutes = Math.floor((sec % 3600) / 60);
            const seconds = Math.floor(sec % 60);
            if (hours > 0) {
                return `${hours}h ${String(minutes).padStart(2, '0')}m ${String(seconds).padStart(2, '0')}s`;
            }
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function parseDurationToSeconds(durStr) {
            if (!durStr || durStr === '-' || durStr === '0m 0s') return 0;
            let secs = 0;
            try {
                if (durStr.includes('h ')) {
                    const parts = durStr.split('h ');
                    const h = parseInt(parts[0]);
                    const rest = parts[1].replace('s', '').split('m ');
                    const m = parseInt(rest[0]);
                    const s = parseInt(rest[1] || 0);
                    secs = h * 3600 + m * 60 + s;
                } else if (durStr.includes('m ')) {
                    const parts = durStr.replace('s', '').split('m ');
                    const m = parseInt(parts[0]);
                    const s = parseInt(parts[1] || 0);
                    secs = m * 60 + s;
                }
            } catch (e) { }
            return secs;
        }

        // ============================================================
        // RANKING BERECHNUNG (KORREKT)
        // ============================================================
        function calculateRanking(players, matches) {
            // Initialisiere Statistiken für alle Spieler
            const stats = {};
            players.forEach(p => {
                stats[p.id] = {
                    id: p.id,
                    name: p.name,
                    verein: p.club_short || '',
                    rc: p.rc_points || 0,
                    matches: 0,
                    wins: 0,
                    sets_won: 0,
                    sets_lost: 0,
                    balls_won: 0,
                    balls_lost: 0,
                    opponents: [],
                    opponentMatches: {},
                    tie_symbol: '',
                    stats: {
                        matches: 0, wins: 0, sets_won: 0, sets_lost: 0, balls_won: 0, balls_lost: 0,
                        tie_symbol: ''
                    }
                };
            });

            // Spiele auswerten
            matches.forEach(m => {
                if (!m.is_played) return;
                const p1 = stats[m.player1_id];
                const p2 = stats[m.player2_id];
                if (!p1 || !p2) return;

                const s1 = m.sets_p1 || 0;
                const s2 = m.sets_p2 || 0;
                const b1 = m.points_p1 || 0;
                const b2 = m.points_p2 || 0;

                p1.matches += 1;
                p2.matches += 1;
                p1.stats.matches += 1;
                p2.stats.matches += 1;

                p1.sets_won += s1;
                p1.sets_lost += s2;
                p2.sets_won += s2;
                p2.sets_lost += s1;
                p1.stats.sets_won += s1;
                p1.stats.sets_lost += s2;
                p2.stats.sets_won += s2;
                p2.stats.sets_lost += s1;

                p1.balls_won += b1;
                p1.balls_lost += b2;
                p2.balls_won += b2;
                p2.balls_lost += b1;
                p1.stats.balls_won += b1;
                p1.stats.balls_lost += b2;
                p2.stats.balls_won += b2;
                p2.stats.balls_lost += b1;

                p1.opponents.push(m.player2_id);
                p2.opponents.push(m.player1_id);
                p1.opponentMatches[m.player2_id] = { sets_p1: s1, sets_p2: s2 };
                p2.opponentMatches[m.player1_id] = { sets_p1: s2, sets_p2: s1 };

                if (s1 > s2) {
                    p1.wins += 1;
                    p1.stats.wins += 1;
                } else {
                    p2.wins += 1;
                    p2.stats.wins += 1;
                }
            });

            // Hilfsfunktion: Prüft, ob alle in der Gruppe gegeneinander gespielt haben
            function allPlayedEachOther(group) {
                for (let i = 0; i < group.length; i++) {
                    for (let j = i + 1; j < group.length; j++) {
                        const hasMatch = group[i].opponentMatches[group[j].id] !== undefined ||
                            group[j].opponentMatches[group[i].id] !== undefined;
                        if (!hasMatch) return false;
                    }
                }
                return true;
            }

            // Minitabelle: Sortiert eine vollständig verbundene Gruppe anhand der direkten Duelle
            function sortByMiniTable(group) {
                const miniStats = {};
                group.forEach(p => {
                    miniStats[p.id] = {
                        ...p,
                        miniWins: 0,
                        miniSetsWon: 0,
                        miniSetsLost: 0,
                        miniBallsWon: 0,
                        miniBallsLost: 0
                    };
                });

                // Zähle die direkten Duelle innerhalb der Gruppe
                for (let i = 0; i < group.length; i++) {
                    for (let j = i + 1; j < group.length; j++) {
                        const p1 = group[i];
                        const p2 = group[j];
                        const match = p1.opponentMatches[p2.id];
                        if (match) {
                            const s1 = match.sets_p1;
                            const s2 = match.sets_p2;
                            if (s1 > s2) {
                                miniStats[p1.id].miniWins += 1;
                            } else {
                                miniStats[p2.id].miniWins += 1;
                            }
                            miniStats[p1.id].miniSetsWon += s1;
                            miniStats[p1.id].miniSetsLost += s2;
                            miniStats[p2.id].miniSetsWon += s2;
                            miniStats[p2.id].miniSetsLost += s1;
                            // Bälle in der Minitabelle sind nicht notwendig, da die direkten Duelle
                            // bereits durch Siege und Sätze abgebildet werden.
                            // Falls doch Gleichstand, wird später RC herangezogen.
                        }
                    }
                }

                // Rekursive Sortierung der Minitabelle mit denselben Kriterien:
                // Mini-Siege, dann Mini-SV, dann Mini-BV, dann RC
                // Dazu nutzen wir die gleiche `sortGroup`-Funktion, aber mit den Mini-Werten.
                // Da die Gruppe vollständig verbunden ist, können wir die Minitabelle
                // einfach nach diesen Kriterien sortieren.
                const sorted = Object.values(miniStats).sort((a, b) => {
                    if (a.miniWins !== b.miniWins) return b.miniWins - a.miniWins;
                    const aSv = a.miniSetsWon / (a.miniSetsLost || 1);
                    const bSv = b.miniSetsWon / (b.miniSetsLost || 1);
                    if (aSv !== bSv) return bSv - aSv;
                    const aBv = a.balls_won / (a.balls_lost || 1);
                    const bBv = b.balls_won / (b.balls_lost || 1);
                    if (aBv !== bBv) return bBv - aBv;
                    return a.rc - b.rc;
                });

                // ⚔️-Symbol für alle setzen, da die Minitabelle angewendet wurde
                sorted.forEach(p => {
                    p.tie_symbol = ' ⚔️';
                    p.stats.tie_symbol = ' ⚔️';
                });

                return sorted;
            }

            // Rekursive Hauptsortierfunktion
            function sortGroup(group) {
                if (group.length <= 1) return group;

                // 1. Nach Siegen gruppieren
                const winsMap = {};
                group.forEach(p => {
                    const w = p.wins;
                    if (!winsMap[w]) winsMap[w] = [];
                    winsMap[w].push(p);
                });

                let result = [];
                const sortedWins = Object.keys(winsMap).sort((a, b) => b - a);
                for (const w of sortedWins) {
                    let subgroup = winsMap[w];
                    if (subgroup.length === 1) {
                        result.push(subgroup[0]);
                        continue;
                    }

                    // Prüfen, ob alle in dieser Sieg-Gruppe gegeneinander gespielt haben
                    if (allPlayedEachOther(subgroup)) {
                        const sortedByMini = sortByMiniTable(subgroup);
                        result = result.concat(sortedByMini);
                        continue;
                    }

                    // Nach SV sortieren
                    const sortedBySV = [...subgroup].sort((a, b) => {
                        const aSv = a.sets_won / (a.sets_lost || 1);
                        const bSv = b.sets_won / (b.sets_lost || 1);
                        return bSv - aSv;
                    });

                    // Gruppen mit gleichem SV bilden
                    let i = 0;
                    let svGroups = [];
                    while (i < sortedBySV.length) {
                        let j = i + 1;
                        const iSv = sortedBySV[i].sets_won / (sortedBySV[i].sets_lost || 1);
                        while (j < sortedBySV.length) {
                            const jSv = sortedBySV[j].sets_won / (sortedBySV[j].sets_lost || 1);
                            if (jSv === iSv) j++;
                            else break;
                        }
                        svGroups.push(sortedBySV.slice(i, j));
                        i = j;
                    }

                    for (const svGroup of svGroups) {
                        if (svGroup.length === 1) {
                            result.push(svGroup[0]);
                            continue;
                        }

                        // Prüfen, ob diese SV-Gruppe gegeneinander gespielt hat
                        if (allPlayedEachOther(svGroup)) {
                            const sortedByMini = sortByMiniTable(svGroup);
                            result = result.concat(sortedByMini);
                            continue;
                        }

                        // Nach BV sortieren
                        const sortedByBV = [...svGroup].sort((a, b) => {
                            const aBv = a.balls_won / (a.balls_lost || 1);
                            const bBv = b.balls_won / (b.balls_lost || 1);
                            return bBv - aBv;
                        });

                        // Gruppen mit gleichem BV bilden
                        let k = 0;
                        let bvGroups = [];
                        while (k < sortedByBV.length) {
                            let l = k + 1;
                            const kBv = sortedByBV[k].balls_won / (sortedByBV[k].balls_lost || 1);
                            while (l < sortedByBV.length) {
                                const lBv = sortedByBV[l].balls_won / (sortedByBV[l].balls_lost || 1);
                                if (lBv === kBv) l++;
                                else break;
                            }
                            bvGroups.push(sortedByBV.slice(k, l));
                            k = l;
                        }

                        for (const bvGroup of bvGroups) {
                            if (bvGroup.length === 1) {
                                result.push(bvGroup[0]);
                                continue;
                            }

                            // Prüfen, ob diese BV-Gruppe gegeneinander gespielt hat
                            if (allPlayedEachOther(bvGroup)) {
                                const sortedByMini = sortByMiniTable(bvGroup);
                                result = result.concat(sortedByMini);
                                continue;
                            }

                            // Nach RC sortieren (niedriger zuerst)
                            const sortedByRC = [...bvGroup].sort((a, b) => a.rc - b.rc);

                            // Gruppen mit gleichem RC bilden
                            let m = 0;
                            let rcGroups = [];
                            while (m < sortedByRC.length) {
                                let n = m + 1;
                                const mRc = sortedByRC[m].rc;
                                while (n < sortedByRC.length) {
                                    if (sortedByRC[n].rc === mRc) n++;
                                    else break;
                                }
                                rcGroups.push(sortedByRC.slice(m, n));
                                m = n;
                            }

                            for (const rcGroup of rcGroups) {
                                if (rcGroup.length === 1) {
                                    result.push(rcGroup[0]);
                                    continue;
                                }

                                // Prüfen, ob diese RC-Gruppe gegeneinander gespielt hat
                                if (allPlayedEachOther(rcGroup)) {
                                    const sortedByMini = sortByMiniTable(rcGroup);
                                    result = result.concat(sortedByMini);
                                } else {
                                    // Alle Werte gleich – bleiben in der Reihenfolge
                                    result = result.concat(rcGroup);
                                }
                            }
                        }
                    }
                }
                return result;
            }

            // Starte mit allen Spielern
            const allPlayers = Object.values(stats);
            const sorted = sortGroup(allPlayers);

            // Stats synchronisieren
            sorted.forEach(p => {
                p.stats.matches = p.matches;
                p.stats.wins = p.wins;
                p.stats.sets_won = p.sets_won;
                p.stats.sets_lost = p.sets_lost;
                p.stats.balls_won = p.balls_won;
                p.stats.balls_lost = p.balls_lost;
                p.stats.tie_symbol = p.tie_symbol || '';
            });

            return sorted;
        }

        // ----- MEIN PLAN -----
        function renderMeinPlan() {
            const container = containers.meinplan;
            if (!container) return;

            const bewerbName = state.selectedBewerb;
            if (!bewerbName) {
                container.innerHTML = `
                    <div style="text-align:center; padding:30px 0; color:var(--text-muted);">

                    </div>
                `;
