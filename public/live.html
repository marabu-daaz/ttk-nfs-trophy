<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Live-Ticker · NFS Trophy</title>
    <meta name="description" content="Live-Ticker, Tabelle und Spielplan der NFS Trophy." />
    <meta property="og:title" content="Live-Ticker – NFS Trophy" />
    <meta property="og:description" content="Live-Tabelle, Spielplan und Ergebnisse der NFS Trophy." />
    <meta property="og:image" content="https://nfs-trophy.com/og-image.png" />
    <meta property="og:type" content="website" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NFS Live" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#071510" />

    <!-- Theme vor dem ersten Rendern setzen (kein Aufblitzen) -->
    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem('theme'); } catch (e) { }
            if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>

    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/styles/fonts.css" />
    <link rel="stylesheet" href="/styles/live.css" />

    <script type="importmap">
        {
            "imports": {
                "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.118.0"
            }
        }
    </script>
    <script type="module" src="/src/live/live.js"></script>
</head>

<body>
    <header class="top">
        <div class="wrap top-inner">
            <a href="/" class="brand" aria-label="Zur Startseite">
                <img src="/icons/logo.png" alt="" width="36" height="36">
                <div>
                    <div class="t1" id="tournamentName">NFS Trophy</div>
                    <div class="t2">Live-Ticker</div>
                </div>
            </a>
            <div class="top-actions">
                <button class="status" id="statusBtn" title="Jetzt aktualisieren">
                    <span class="dot" id="statusDot"></span>
                    <span id="statusText">Verbinde…</span>
                </button>
                <button class="icon-btn" id="themeToggle" aria-label="Hell/Dunkel umschalten"></button>
            </div>
        </div>

        <div class="wrap">
            <div class="chips-scroll" id="bewerbChips" role="tablist" aria-label="Bewerb wählen"></div>
        </div>

        <nav class="tabs" aria-label="Ansicht">
            <div class="wrap tabs-inner" id="tabs">
                <button data-tab="live">Live</button>
                <button data-tab="table">Tabelle</button>
                <button data-tab="player">Spieler</button>
                <button data-tab="queue">Warteschlange</button>
                <button data-tab="pots">Töpfe</button>
                <button data-tab="stats">Statistik</button>
                <button data-tab="system">System</button>
            </div>
        </nav>
    </header>

    <main class="wrap main">
        <div id="favBanner"></div>

        <section class="tab-panel" id="tab-live"></section>

        <section class="tab-panel" id="tab-table" hidden>
            <div class="search">
                <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></svg>
                <input type="search" id="tableSearch" placeholder="Spieler oder Verein suchen…" autocomplete="off">
            </div>
            <div id="tableContainer"></div>
        </section>

        <section class="tab-panel" id="tab-player" hidden>
            <div class="search">
                <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></svg>
                <input type="search" id="playerSearch" placeholder="Deinen Namen suchen…" autocomplete="off">
            </div>
            <div id="playerSuggest" class="suggest"></div>
            <div id="playerContainer"></div>
        </section>

        <section class="tab-panel" id="tab-queue" hidden></section>
        <section class="tab-panel" id="tab-pots" hidden></section>
        <section class="tab-panel" id="tab-stats" hidden></section>
        <section class="tab-panel" id="tab-system" hidden></section>
    </main>

    <footer class="wrap foot">
        <span id="lastUpdate"></span>
        <a href="/">nfs-trophy.com</a>
    </footer>

    <div id="toastContainer" class="toast-container" aria-live="polite"></div>
</body>

</html>
